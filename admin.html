<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão Completo | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="min-h-screen pb-20">

    <!-- MODAL DE CARREGAMENTO (POP-UP) -->
    <div id="loading-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center transition-opacity duration-300 opacity-0">
        <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center gap-4 text-center max-w-sm w-[90%] mx-auto transform transition-transform scale-95" id="modal-content">
            <!-- Spinner -->
            <div id="modal-spinner" class="w-14 h-14 border-4 border-sky-100 border-t-sky-600 rounded-full animate-spin"></div>
            <!-- Check Sucesso (Escondido por padrão) -->
            <div id="modal-success" class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl hidden">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modal-text" class="text-lg font-bold text-slate-800 mt-2">A guardar informações...</h3>
            <p id="modal-subtext" class="text-xs text-slate-500">Por favor, aguarde um momento.</p>
        </div>
    </div>

    <header class="bg-slate-900 text-white py-6 px-4 sm:px-8 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-sky-500 rounded-lg flex items-center justify-center text-white text-xl shadow-lg shrink-0">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Painel de Controlo Total</h1>
                    <p class="text-xs text-slate-400">Edição e Sincronização em Tempo Real</p>
                </div>
            </div>
            <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-sky-400 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 border border-slate-700 hover:border-sky-500">
                <i class="fa-solid fa-external-link"></i> Ver Site
            </a>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- COLUNA 1: CONFIGURAÇÕES -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-sky-500"></i> Aparência e Textos
                </h2>
                <form id="site-settings-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Logo do Site (PNG/JPG)</label>
                        <input type="file" id="cfg-logo-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-sky-50 file:text-sky-700 cursor-pointer">
                        <img id="cfg-logo-preview" class="mt-2 h-12 object-contain hidden border rounded p-1">
                        <input type="hidden" id="cfg-logo-base64">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Imagem de Capa (Fundo)</label>
                        <input type="file" id="cfg-hero-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-sky-50 file:text-sky-700 cursor-pointer">
                        <img id="cfg-hero-preview" class="mt-2 h-20 w-full object-cover hidden border rounded p-1">
                        <input type="hidden" id="cfg-hero-base64">
                    </div>

                    <!-- PERSONALIZAÇÃO DE CORES -->
                    <div class="border-t pt-3">
                        <label class="block text-xs font-bold text-slate-800 uppercase mb-2">Cores do Site</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] text-slate-500">Texto Azul</label>
                                <input type="color" id="cfg-color-blue" value="#0284c7" class="w-full h-9 p-1 rounded border border-slate-300 cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-[10px] text-slate-500">Texto Branco</label>
                                <input type="color" id="cfg-color-white" value="#ffffff" class="w-full h-9 p-1 rounded border border-slate-300 cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-[10px] text-slate-500">Fundo Rodapé</label>
                                <input type="color" id="cfg-color-footer" value="#0f172a" class="w-full h-9 p-1 rounded border border-slate-300 cursor-pointer">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nome da Empresa</label>
                        <input type="text" id="cfg-brand" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Título Inicial</label>
                        <input type="text" id="cfg-hero-title" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Subtítulo Inicial</label>
                        <input type="text" id="cfg-hero-subtitle" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>

                    <!-- CARTÃO DE INTERESSE & MENSAGENS -->
                    <div class="border-t pt-3 space-y-2">
                        <label class="block text-xs font-bold text-slate-800 uppercase">Cartão de Interesse & WhatsApp</label>
                        <div>
                            <label class="block text-[10px] text-slate-500">Título do Cartão na Subpágina</label>
                            <input type="text" id="cfg-cta-title" placeholder="Tem interesse?" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">Texto do Cartão na Subpágina</label>
                            <textarea id="cfg-cta-text" rows="2" placeholder="Entre em contacto direto com o consultor..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500 resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">Mensagem WhatsApp Padrão (Site Geral)</label>
                            <input type="text" id="cfg-wa-default-msg" placeholder="Olá! Estou no vosso site e gostaria de mais informações." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                    </div>

                    <!-- HORÁRIO DE ATENDIMENTO -->
                    <div class="border-t pt-3 space-y-2">
                        <label class="block text-xs font-bold text-slate-800 uppercase">Horário de Atendimento</label>
                        <div>
                            <label class="block text-[10px] text-slate-500">Segunda a Sexta</label>
                            <input type="text" id="cfg-hours-week" placeholder="09:00 - 18:00" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">Sábados</label>
                            <input type="text" id="cfg-hours-sat" placeholder="10:00 - 14:00" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">Domingos</label>
                            <input type="text" id="cfg-hours-sun" placeholder="Fechado" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                    </div>

                    <!-- REDES SOCIAIS -->
                    <div class="border-t pt-3 space-y-2">
                        <label class="block text-xs font-bold text-slate-800 uppercase">Redes Sociais (Link Completo)</label>
                        <div>
                            <label class="block text-[10px] text-slate-500">Facebook</label>
                            <input type="url" id="cfg-facebook" placeholder="https://facebook.com/sua-pagina" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">WhatsApp (Link direct/número)</label>
                            <input type="text" id="cfg-social-whatsapp" placeholder="https://wa.me/351..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">LinkedIn</label>
                            <input type="url" id="cfg-linkedin" placeholder="https://linkedin.com/in/seu-perfil" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500">
                        </div>
                    </div>

                    <div class="border-t pt-3">
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">WhatsApp de Contacto (com 351)</label>
                        <input type="text" id="cfg-whatsapp" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email de Contacto</label>
                        <input type="text" id="cfg-email" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Texto do Rodapé</label>
                        <textarea id="cfg-footer-desc" rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500 resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-lg text-sm transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Atualizar Site
                    </button>
                </form>
            </div>
        </div>

        <!-- COLUNA 2 & 3: IMÓVEIS -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2" id="form-title">
                        <i class="fa-solid fa-house-medical text-emerald-500"></i> Adicionar/Editar Imóvel
                    </h2>
                    <button type="button" id="btn-cancel-edit" onclick="resetPropertyForm()" class="hidden text-xs text-rose-600 font-bold hover:underline">Cancelar</button>
                </div>

                <form id="property-form" class="space-y-4">
                    <input type="hidden" id="prop-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Título</label>
                            <input type="text" id="prop-title" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Preço (€)</label>
                            <input type="number" id="prop-price" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Localização</label>
                            <input type="text" id="prop-location" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo</label>
                            <select id="prop-type" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                                <option value="Apartamento">Apartamento</option>
                                <option value="Moradia">Moradia</option>
                                <option value="Estúdio">Estúdio</option>
                                <option value="Quinta">Quinta</option>
                                <option value="Terreno">Terreno</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Quartos</label><input type="number" id="prop-beds" value="0" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none"></div>
                        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Casas de Banho</label><input type="number" id="prop-baths" value="0" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none"></div>
                        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Área (m²)</label><input type="number" id="prop-area" value="0" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none"></div>
                        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ano</label><input type="number" id="prop-year" value="2026" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Descrição</label>
                        <textarea id="prop-desc" rows="4" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500 resize-none"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t pt-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Capa do Imóvel</label>
                            <input type="file" id="prop-main-image" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-sky-50 file:text-sky-700 cursor-pointer">
                            <input type="hidden" id="prop-main-base64">
                            <img id="prop-main-preview" class="mt-2 h-24 w-full object-cover hidden border rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Galeria (Várias)</label>
                            <input type="file" id="prop-gallery-images" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-sky-50 file:text-sky-700 cursor-pointer">
                            <div id="prop-gallery-preview" class="mt-2 grid grid-cols-3 gap-2"></div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg text-sm transition shadow-md flex items-center justify-center gap-2 mt-4">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Imóvel
                    </button>
                </form>
            </div>

            <!-- Lista -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-3"><i class="fa-solid fa-list text-indigo-500"></i> Imóveis Publicados</h2>
                <div id="admin-properties-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCx8OyFbqjgaJ8SUs1xfMuK8Tbeg6MklJY",
            authDomain: "alojamento-c4f0a.firebaseapp.com",
            projectId: "alojamento-c4f0a"
        });
        const db = getFirestore(app);
        let catalogList = [];
        let currentGalleryBase64 = [];

        // SISTEMA DE POP-UP (MODAL DE LOADING)
        const modal = document.getElementById('loading-modal');
        const modalContent = document.getElementById('modal-content');
        const modalSpinner = document.getElementById('modal-spinner');
        const modalSuccess = document.getElementById('modal-success');
        const modalText = document.getElementById('modal-text');
        const modalSubtext = document.getElementById('modal-subtext');

        function showLoadingModal(title) {
            modalSpinner.classList.remove('hidden');
            modalSuccess.classList.add('hidden');
            modalText.innerText = title;
            modalSubtext.innerText = "Por favor, aguarde enquanto guardamos os dados no sistema...";
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10);
        }

        function showSuccessModal(message) {
            modalSpinner.classList.add('hidden');
            modalSuccess.classList.remove('hidden');
            modalText.innerText = message;
            modalSubtext.innerText = "Atualizado em tempo real!";
            
            setTimeout(() => {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }, 2000);
        }

        function compressImage(file, maxWidth = 800, quality = 0.6) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        onSnapshot(doc(db, "settings", "general"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('cfg-brand').value = data.brandName || "";
                document.getElementById('cfg-hero-title').value = data.heroTitle || "";
                document.getElementById('cfg-hero-subtitle').value = data.heroSubtitle || "";
                document.getElementById('cfg-whatsapp').value = data.whatsapp || "";
                document.getElementById('cfg-email').value = data.email || "";
                document.getElementById('cfg-footer-desc').value = data.footerText || "";
                
                // Cartão de Interesse e WhatsApp
                document.getElementById('cfg-cta-title').value = data.ctaTitle || "Tem interesse?";
                document.getElementById('cfg-cta-text').value = data.ctaText || "Entre em contacto direto com o consultor para agendar uma visita ou esclarecer dúvidas.";
                document.getElementById('cfg-wa-default-msg').value = data.whatsappDefaultMsg || "Olá! Estou no vosso site e gostaria de mais informações.";

                // Cores
                document.getElementById('cfg-color-blue').value = data.colorBlue || "#0284c7";
                document.getElementById('cfg-color-white').value = data.colorWhite || "#ffffff";
                document.getElementById('cfg-color-footer').value = data.colorFooter || "#0f172a";

                // Horários
                document.getElementById('cfg-hours-week').value = data.hoursWeek || "09:00 - 18:00";
                document.getElementById('cfg-hours-sat').value = data.hoursSat || "10:00 - 14:00";
                document.getElementById('cfg-hours-sun').value = data.hoursSun || "Fechado";

                // Redes Sociais
                document.getElementById('cfg-facebook').value = data.socialFacebook || "";
                document.getElementById('cfg-social-whatsapp').value = data.socialWhatsapp || "";
                document.getElementById('cfg-linkedin').value = data.socialLinkedin || "";

                if (data.logoBase64) {
                    document.getElementById('cfg-logo-base64').value = data.logoBase64;
                    document.getElementById('cfg-logo-preview').src = data.logoBase64;
                    document.getElementById('cfg-logo-preview').classList.remove('hidden');
                }
                if (data.heroImageBase64) {
                    document.getElementById('cfg-hero-base64').value = data.heroImageBase64;
                    document.getElementById('cfg-hero-preview').src = data.heroImageBase64;
                    document.getElementById('cfg-hero-preview').classList.remove('hidden');
                }
            }
        });

        onSnapshot(collection(db, "properties"), (snapshot) => {
            catalogList = snapshot.docs.map(doc => ({ fb_id: doc.id, ...doc.data() }));
            renderAdminList();
        });

        // Configurações Gerais - Salvar
        document.getElementById('site-settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoadingModal("A atualizar o site...");
            
            try {
                await setDoc(doc(db, "settings", "general"), {
                    brandName: document.getElementById('cfg-brand').value,
                    heroTitle: document.getElementById('cfg-hero-title').value,
                    heroSubtitle: document.getElementById('cfg-hero-subtitle').value,
                    whatsapp: document.getElementById('cfg-whatsapp').value,
                    email: document.getElementById('cfg-email').value,
                    footerText: document.getElementById('cfg-footer-desc').value,
                    ctaTitle: document.getElementById('cfg-cta-title').value,
                    ctaText: document.getElementById('cfg-cta-text').value,
                    whatsappDefaultMsg: document.getElementById('cfg-wa-default-msg').value,
                    colorBlue: document.getElementById('cfg-color-blue').value,
                    colorWhite: document.getElementById('cfg-color-white').value,
                    colorFooter: document.getElementById('cfg-color-footer').value,
                    hoursWeek: document.getElementById('cfg-hours-week').value,
                    hoursSat: document.getElementById('cfg-hours-sat').value,
                    hoursSun: document.getElementById('cfg-hours-sun').value,
                    socialFacebook: document.getElementById('cfg-facebook').value,
                    socialWhatsapp: document.getElementById('cfg-social-whatsapp').value,
                    socialLinkedin: document.getElementById('cfg-linkedin').value,
                    logoBase64: document.getElementById('cfg-logo-base64').value,
                    heroImageBase64: document.getElementById('cfg-hero-base64').value
                }, { merge: true });
                showSuccessModal("Site atualizado com sucesso!");
            } catch (error) {
                alert("Erro ao guardar as alterações. Por favor, tente novamente.");
                modal.classList.add('hidden');
            }
        });

        document.getElementById('cfg-logo-file').addEventListener('change', async (e) => { if(e.target.files[0]) { const b64 = await compressImage(e.target.files[0], 300, 0.9); document.getElementById('cfg-logo-base64').value = b64; document.getElementById('cfg-logo-preview').src = b64; document.getElementById('cfg-logo-preview').classList.remove('hidden'); } });
        document.getElementById('cfg-hero-file').addEventListener('change', async (e) => { if(e.target.files[0]) { const b64 = await compressImage(e.target.files[0], 1200, 0.7); document.getElementById('cfg-hero-base64').value = b64; document.getElementById('cfg-hero-preview').src = b64; document.getElementById('cfg-hero-preview').classList.remove('hidden'); } });
        document.getElementById('prop-main-image').addEventListener('change', async (e) => { if(e.target.files[0]) { const b64 = await compressImage(e.target.files[0]); document.getElementById('prop-main-base64').value = b64; document.getElementById('prop-main-preview').src = b64; document.getElementById('prop-main-preview').classList.remove('hidden'); } });
        document.getElementById('prop-gallery-images').addEventListener('change', async (e) => {
            currentGalleryBase64 = [];
            const previewContainer = document.getElementById('prop-gallery-preview');
            previewContainer.innerHTML = '';
            for(let i=0; i<e.target.files.length; i++){
                const b64 = await compressImage(e.target.files[i]);
                currentGalleryBase64.push(b64);
                previewContainer.innerHTML += `<img src="${b64}" class="h-16 w-full object-cover rounded border">`;
            }
        });

        // Guardar Imóvel
        document.getElementById('property-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoadingModal("A guardar o imóvel...");
            
            try {
                const id = document.getElementById('prop-id').value;
                let fb_doc_id = id || Date.now().toString();

                const propData = {
                    id: fb_doc_id,
                    title: document.getElementById('prop-title').value,
                    price: parseFloat(document.getElementById('prop-price').value),
                    location: document.getElementById('prop-location').value,
                    type: document.getElementById('prop-type').value,
                    beds: parseInt(document.getElementById('prop-beds').value),
                    baths: parseInt(document.getElementById('prop-baths').value),
                    area: parseInt(document.getElementById('prop-area').value),
                    year: parseInt(document.getElementById('prop-year').value),
                    description: document.getElementById('prop-desc').value,
                    mainImage: document.getElementById('prop-main-base64').value || "https://via.placeholder.com/800",
                    gallery: currentGalleryBase64.length > 0 ? currentGalleryBase64 : (id ? null : []) 
                };
                if(id && currentGalleryBase64.length === 0) delete propData.gallery;

                await setDoc(doc(db, "properties", fb_doc_id), propData, { merge: true });
                resetPropertyForm();
                showSuccessModal("Imóvel publicado!");
            } catch (error) {
                alert("Erro ao guardar o imóvel. Por favor, tente novamente.");
                modal.classList.add('hidden');
            }
        });

        window.editProperty = function(fb_id) {
            const prop = catalogList.find(p => p.fb_id === fb_id);
            if (!prop) return;
            document.getElementById('prop-id').value = prop.fb_id;
            document.getElementById('prop-title').value = prop.title;
            document.getElementById('prop-price').value = prop.price;
            document.getElementById('prop-location').value = prop.location;
            document.getElementById('prop-type').value = prop.type;
            document.getElementById('prop-beds').value = prop.beds;
            document.getElementById('prop-baths').value = prop.baths;
            document.getElementById('prop-area').value = prop.area;
            document.getElementById('prop-year').value = prop.year;
            document.getElementById('prop-desc').value = prop.description;
            document.getElementById('prop-main-base64').value = prop.mainImage;
            document.getElementById('prop-main-preview').src = prop.mainImage;
            document.getElementById('prop-main-preview').classList.remove('hidden');

            currentGalleryBase64 = prop.gallery || [];
            const previewContainer = document.getElementById('prop-gallery-preview');
            previewContainer.innerHTML = '';
            currentGalleryBase64.forEach(img => { previewContainer.innerHTML += `<img src="${img}" class="h-16 w-full object-cover rounded border">`; });

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen text-amber-500"></i> Editar Imóvel`;
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            window.scrollTo(0,0);
        };

        window.deleteProperty = async function(fb_id) {
            if (confirm("Deseja eliminar definitivamente este imóvel?")) {
                showLoadingModal("A eliminar imóvel...");
                await deleteDoc(doc(db, "properties", fb_id));
                showSuccessModal("Imóvel removido!");
            }
        };

        window.resetPropertyForm = function() {
            document.getElementById('property-form').reset();
            document.getElementById('prop-id').value = '';
            document.getElementById('prop-main-base64').value = '';
            document.getElementById('prop-main-preview').classList.add('hidden');
            document.getElementById('prop-gallery-preview').innerHTML = '';
            currentGalleryBase64 = [];
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-house-medical text-emerald-500"></i> Adicionar Imóvel`;
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            document.getElementById('prop-year').value = "2026";
        };

        function renderAdminList() {
            const list = document.getElementById('admin-properties-list');
            list.innerHTML = catalogList.length === 0 ? '<p class="text-xs text-slate-400">Sem imóveis publicados.</p>' : '';
            catalogList.forEach(prop => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border rounded-xl">
                        <div class="flex items-center gap-3"><img src="${prop.mainImage}" class="w-12 h-12 rounded-lg object-cover">
                            <div><p class="font-bold text-sm text-slate-800">${prop.title}</p><p class="text-xs text-slate-500">${prop.price.toLocaleString('pt-PT')} € • ${prop.location}</p></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editProperty('${prop.fb_id}')" class="text-slate-600 hover:text-amber-600 p-2"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteProperty('${prop.fb_id}')" class="text-slate-600 hover:text-rose-600 p-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
