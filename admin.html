<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão | Lumière Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header do Painel -->
    <header class="bg-slate-900 text-white py-6 px-8 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-sky-500 rounded-lg flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Painel de Controlo em Tempo Real</h1>
                    <p class="text-xs text-slate-400">Gerencie todos os textos, contactos e imóveis do site</p>
                </div>
            </div>
            <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-external-link"></i> Abrir Site
            </a>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- COLUNA 1: CONFIGURAÇÕES DO SITE -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-gear text-sky-500"></i> Definições do Site
                </h2>

                <form id="site-settings-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nome da Empresa / Marca</label>
                        <input type="text" id="cfg-brand" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Título do Hero (Banner)</label>
                        <input type="text" id="cfg-hero-title" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Subtítulo do Hero</label>
                        <input type="text" id="cfg-hero-subtitle" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Texto do Botão de Contacto</label>
                        <input type="text" id="cfg-btn-text" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Número de WhatsApp (Portugal)</label>
                        <input type="text" id="cfg-whatsapp" placeholder="Ex: 351912345678" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        <p class="text-[11px] text-slate-400 mt-1">Inclua o código 351 antes do número de telefone.</p>
                    </div>

                    <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
                        Guardar Alterações
                    </button>
                </form>
            </div>
        </div>

        <!-- COLUNA 2 & 3: GESTÃO DE IMÓVEIS -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Formulário Adicionar / Editar Imóvel -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2" id="form-title">
                        <i class="fa-solid fa-plus text-emerald-500"></i> Adicionar Novo Imóvel
                    </h2>
                    <button type="button" id="btn-cancel-edit" onclick="resetPropertyForm()" class="hidden text-xs text-rose-600 font-bold hover:underline">
                        Cancelar Edição
                    </button>
                </div>

                <form id="property-form" class="space-y-4">
                    <input type="hidden" id="prop-id">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Título do Imóvel</label>
                            <input type="text" id="prop-title" required placeholder="Ex: Moradia Vista Mar" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Preço (€ Euros)</label>
                            <input type="number" id="prop-price" required placeholder="Ex: 450000" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Localização</label>
                            <input type="text" id="prop-location" required placeholder="Ex: Cascais, Lisboa" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo de Imóvel</label>
                            <select id="prop-type" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                                <option value="Apartamento">Apartamento</option>
                                <option value="Moradia">Moradia</option>
                                <option value="Estúdio">Estúdio</option>
                                <option value="Quinta">Quinta</option>
                                <option value="Penthouse">Penthouse</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Quartos</label>
                            <input type="number" id="prop-beds" value="2" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">WC</label>
                            <input type="number" id="prop-baths" value="2" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Área (m²)</label>
                            <input type="number" id="prop-area" value="120" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ano</label>
                            <input type="number" id="prop-year" value="2023" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Descrição do Imóvel</label>
                        <textarea id="prop-desc" rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-sky-500 resize-none"></textarea>
                    </div>

                    <!-- Upload de Imagem com Redimensionamento Automático para Base64 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Imagem Principal (Carregar do Computador)</label>
                        <input type="file" id="prop-image-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer">
                        <input type="hidden" id="prop-main-image-base64">
                        <div id="image-preview-container" class="mt-2 hidden">
                            <img id="image-preview" src="" class="h-24 w-40 object-cover rounded-lg border">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg text-sm transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Imóvel no Firebase
                    </button>
                </form>
            </div>

            <!-- Lista de Imóveis Cadastrados -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-list text-indigo-500"></i> Imóveis Atuais
                </h2>

                <div id="admin-properties-list" class="space-y-4">
                    <!-- Injetado via JS -->
                </div>
            </div>

        </div>

    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx8OyFbqjgaJ8SUs1xfMuK8Tbeg6MklJY",
            authDomain: "alojamento-c4f0a.firebaseapp.com",
            projectId: "alojamento-c4f0a",
            storageBucket: "alojamento-c4f0a.firebasestorage.app",
            messagingSenderId: "650640192233",
            appId: "1:650640192233:web:c09f5d56c13617f1207678"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let catalogList = [];

        // 1. Ouvir Definições
        onSnapshot(doc(db, "settings", "general"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('cfg-brand').value = data.brandName || "Lumière";
                document.getElementById('cfg-hero-title').value = data.heroTitle || "";
                document.getElementById('cfg-hero-subtitle').value = data.heroSubtitle || "";
                document.getElementById('cfg-btn-text').value = data.btnContactText || "Contactar";
                document.getElementById('cfg-whatsapp').value = data.whatsapp || "";
            }
        });

        // 2. Ouvir Catálogo
        onSnapshot(doc(db, "settings", "catalog"), (docSnap) => {
            if (docSnap.exists()) {
                catalogList = docSnap.data().items || [];
                renderAdminList();
            }
        });

        // Guardar Definições Gerais
        document.getElementById('site-settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const config = {
                brandName: document.getElementById('cfg-brand').value,
                heroTitle: document.getElementById('cfg-hero-title').value,
                heroSubtitle: document.getElementById('cfg-hero-subtitle').value,
                btnContactText: document.getElementById('cfg-btn-text').value,
                whatsapp: document.getElementById('cfg-whatsapp').value
            };
            await setDoc(doc(db, "settings", "general"), config);
            alert("Definições atualizadas com sucesso!");
        });

        // Função de Redimensionamento / Compressão de Imagem para Base64
        function compressImage(file, maxWidth = 900, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        document.getElementById('prop-image-file').addEventListener('change', async (e) => {
            if (e.target.files && e.target.files[0]) {
                const base64 = await compressImage(e.target.files[0]);
                document.getElementById('prop-main-image-base64').value = base64;
                document.getElementById('image-preview').src = base64;
                document.getElementById('image-preview-container').classList.remove('hidden');
            }
        });

        // Guardar/Atualizar Imóvel
        document.getElementById('property-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('prop-id').value;
            const title = document.getElementById('prop-title').value;
            const price = parseFloat(document.getElementById('prop-price').value);
            const location = document.getElementById('prop-location').value;
            const type = document.getElementById('prop-type').value;
            const beds = parseInt(document.getElementById('prop-beds').value);
            const baths = parseInt(document.getElementById('prop-baths').value);
            const area = parseInt(document.getElementById('prop-area').value);
            const year = parseInt(document.getElementById('prop-year').value);
            const description = document.getElementById('prop-desc').value;
            let mainImage = document.getElementById('prop-main-image-base64').value;

            if (!mainImage) {
                mainImage = "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80";
            }

            if (id) {
                // Modo Edição
                const index = catalogList.findIndex(p => p.id == id);
                if (index !== -1) {
                    catalogList[index] = { id: parseInt(id), title, price, location, type, beds, baths, area, year, description, mainImage, images: [] };
                }
            } else {
                // Modo Adicionar
                const newId = catalogList.length > 0 ? Math.max(...catalogList.map(p => p.id)) + 1 : 1;
                catalogList.push({ id: newId, title, price, location, type, beds, baths, area, year, description, mainImage, images: [] });
            }

            await setDoc(doc(db, "settings", "catalog"), { items: catalogList });
            resetPropertyForm();
            alert("Imóvel guardado no Firebase!");
        });

        window.editProperty = function(id) {
            const prop = catalogList.find(p => p.id === id);
            if (!prop) return;

            document.getElementById('prop-id').value = prop.id;
            document.getElementById('prop-title').value = prop.title;
            document.getElementById('prop-price').value = prop.price;
            document.getElementById('prop-location').value = prop.location;
            document.getElementById('prop-type').value = prop.type;
            document.getElementById('prop-beds').value = prop.beds;
            document.getElementById('prop-baths').value = prop.baths;
            document.getElementById('prop-area').value = prop.area;
            document.getElementById('prop-year').value = prop.year || 2023;
            document.getElementById('prop-desc').value = prop.description;
            document.getElementById('prop-main-image-base64').value = prop.mainImage;

            document.getElementById('image-preview').src = prop.mainImage;
            document.getElementById('image-preview-container').classList.remove('hidden');

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen text-amber-500"></i> Editar Imóvel #${prop.id}`;
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
        };

        window.deleteProperty = async function(id) {
            if (confirm("Tem a certeza que deseja eliminar este imóvel?")) {
                catalogList = catalogList.filter(p => p.id !== id);
                await setDoc(doc(db, "settings", "catalog"), { items: catalogList });
            }
        };

        window.resetPropertyForm = function() {
            document.getElementById('property-form').reset();
            document.getElementById('prop-id').value = '';
            document.getElementById('prop-main-image-base64').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-plus text-emerald-500"></i> Adicionar Novo Imóvel`;
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        };

        function renderAdminList() {
            const listContainer = document.getElementById('admin-properties-list');
            listContainer.innerHTML = '';

            if (catalogList.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400 italic">Nenhum imóvel registado.</p>`;
                return;
            }

            catalogList.forEach(prop => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 bg-slate-50 border rounded-xl hover:bg-slate-100 transition";
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${prop.mainImage}" class="w-12 h-12 rounded-lg object-cover">
                        <div>
                            <p class="font-bold text-sm text-slate-800">${prop.title}</p>
                            <p class="text-xs text-slate-500">${prop.type} • ${prop.price.toLocaleString('pt-PT')} € • ${prop.location}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editProperty(${prop.id})" class="text-slate-600 hover:text-amber-600 p-2 text-sm"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProperty(${prop.id})" class="text-slate-600 hover:text-rose-600 p-2 text-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>
